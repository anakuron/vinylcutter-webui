<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinyl Cutter</title>
<style>
:root {
  --bg: #0e1116;
  --panel: #161b23;
  --panel-2: #1d2430;
  --line: #2a3342;
  --text: #e6ebf2;
  --dim: #8b97a8;
  --accent: #4cc2ff;
  --green: #3ddc84;
  --red: #ff5d5d;
  --amber: #ffb454;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }

/* header */
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
header h1 { font-size: 20px; margin: 0; letter-spacing: .3px; }
header .logo { font-size: 24px; }
.badge {
  font-family: var(--mono); font-size: 12px; color: var(--dim);
  background: var(--panel); border: 1px solid var(--line);
  padding: 3px 9px; border-radius: 999px;
}
.badge b { color: var(--accent); font-weight: 600; }
.badge select {
  background: none; border: 0; padding: 0; margin: 0;
  color: var(--accent); font: inherit; cursor: pointer; outline: none;
}
.badge select option { background: var(--panel-2); color: var(--text); }

/* cards */
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 16px; margin-bottom: 16px;
}
.card h2 {
  margin: 0 0 12px; font-size: 13px; text-transform: uppercase;
  letter-spacing: 1.2px; color: var(--dim); font-weight: 600;
  display: flex; align-items: center; gap: 8px;
}
.count { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 0 8px; font-size: 12px; color: var(--text); }
.card h2 input {
  margin-left: auto; width: 150px;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
  border-radius: 8px; padding: 4px 10px;
  font: 12.5px var(--mono); outline: none;
}
.card h2 input:focus { border-color: var(--accent); }
.card h2 button { margin-left: auto; }

/* dropzone */
.dropzone {
  border: 2px dashed var(--line); border-radius: 10px;
  padding: 28px 16px; text-align: center; color: var(--dim);
  transition: border-color .15s, background .15s, color .15s;
  cursor: pointer;
}
.dropzone:hover, .dropzone.drag { border-color: var(--accent); color: var(--text); background: rgba(76,194,255,.05); }
.dropzone .big { font-size: 16px; color: var(--text); margin-bottom: 4px; }
.dropzone .hint { font-size: 12.5px; }
.dropzone input[type=file] { display: none; }

/* buttons */
button {
  font: inherit; font-size: 13.5px; font-weight: 600;
  color: var(--text); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 14px; cursor: pointer;
  transition: background .12s, border-color .12s, opacity .12s;
}
button:hover { background: #242d3d; border-color: #3a465a; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #04121c; }
button.primary:hover { background: #6fd0ff; }
button.danger:hover { border-color: var(--red); color: var(--red); }
button.small { padding: 5px 10px; font-size: 12.5px; }

/* file table */
/* overflow-x: last-resort containment — if a very long name makes the
   columns wider than a narrow window, the table scrolls inside the card
   instead of spilling over it (never triggered for normal names) */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); font-weight: 600; }
tr:last-child td { border-bottom: none; }
td.name {
  font-family: var(--mono); font-size: 13px;
  /* keep the name unbreakable so its column min-width = content width
     (break-all would let the auto layout squeeze it below its content
     and wrap short names); the spacer column then absorbs ALL slack.
     max-width bounds pathologically long names (the table would otherwise
     overflow the card); ellipsis + a JS-set tooltip cover the clipped tail */
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 560px;
}
td.num { color: var(--dim); white-space: nowrap; font-size: 13px; }
/* name/size/uploaded hug their content (auto layout, no clipping); the
   spacer column absorbs the table's slack so the gap lands between
   Uploaded and Actions, and the Actions column (sized to its buttons)
   stays pinned to the right edge with its header above Cut */
th:nth-child(5), td:nth-child(5) { overflow: hidden; }  /* actions = col 5 (spacer is 4) */
th.spacer, td.spacer { width: 100%; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--text); }
th .arrow { color: var(--accent); font-size: 10px; }
/* the narrow Actions column: header left edge lines up with Cut, and
   Delete ends at the table's right edge */
.row-actions { white-space: nowrap; display: flex; justify-content: space-between; gap: 6px; }
.empty { color: var(--dim); text-align: center; padding: 18px 0; font-size: 13.5px; }

/* jobs */
.job-block { border-bottom: 1px solid var(--line); }
.job-block:last-child { border-bottom: none; }
.job { display: flex; align-items: center; gap: 10px; padding: 8px 4px; font-size: 13.5px; }
.job-hint {
  padding: 0 4px 10px 24px;
  color: var(--amber); font-family: var(--mono); font-size: 12px;
  line-height: 1.6; white-space: pre-line;
}
.job .file { font-family: var(--mono); font-size: 12.5px; }
.job .msg { color: var(--dim); font-size: 12.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job .time { color: var(--dim); font-size: 12px; white-space: nowrap; }
.pill {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px;
  padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
  min-width: 74px; text-align: center;
}
.pill.queued   { color: var(--dim); }
.pill.printing { color: var(--accent); border-color: var(--accent); animation: pulse 1.1s infinite; }
.pill.done     { color: var(--green); border-color: var(--green); }
.pill.error    { color: var(--red); border-color: var(--red); }
@keyframes pulse { 50% { opacity: .45; } }

/* toast */
#toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
  padding: 10px 18px; border-radius: 10px; font-size: 13.5px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  max-width: 80vw;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.error { border-color: var(--red); color: var(--red); }
#toast.warn  { border-color: var(--amber); color: var(--amber); }

/* preview modal */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(5, 8, 12, .72);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.modal-overlay[hidden] { display: none; }  /* display:flex above would otherwise beat the hidden attribute */
.modal {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  width: min(880px, 100%); max-height: 100%;
  padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px;
}
.modal-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.modal-head .name {
  font-family: var(--mono); font-size: 13px; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.preview-dims { color: var(--dim); font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.modal-head button { margin-left: auto; flex: none; }
#preview-body {
  height: min(58vh, 560px);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  overflow: hidden; display: flex;
}
#preview-body svg { width: 100%; height: 100%; }
.preview-legend { display: flex; gap: 18px; color: var(--dim); font-size: 12px; }
.preview-legend .sw { display: inline-block; width: 18px; border-top: 2px solid var(--accent); vertical-align: middle; margin-right: 6px; }
.preview-legend .sw.up { border-top-style: dashed; border-top-color: var(--dim); }
.preview-msg { margin: auto; font-size: 13.5px; color: var(--dim); text-align: center; padding: 0 16px; }
.preview-msg.error { color: var(--red); }

@media (max-width: 640px) {
  th.spacer, td.spacer { display: none; }  /* no slack left to absorb on narrow screens */
  th:nth-child(3), td:nth-child(3) { display: none; }
  td.name { white-space: normal; word-break: break-all; max-width: 100%; }  /* names wrap so rows fit narrow screens */
  .card h2 input { width: 110px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo">✂️</span>
    <h1>Vinyl Cutter</h1>
    <span class="badge">printer <select id="printer-select" title="select the print target device"><option>…</option></select></span>
    <span class="badge">uploads <b id="cfg-dir">…</b></span>
    <span class="badge" id="cfg-exts" hidden></span>
  </header>

  <div class="card">
    <h2>Upload</h2>
    <div class="dropzone" id="dropzone">
      <div class="big">Drop <span id="dz-exts">HPGL</span> files here, or click to browse</div>
      <div class="hint">Files are stored in the uploads folder</div>
      <input type="file" id="file-input" multiple>
    </div>
  </div>

  <div class="card">
    <h2>Files <span class="count" id="file-count">0</span>
      <input type="search" id="file-search" placeholder="filter by name…" autocomplete="off"></h2>
    <div class="table-wrap">
    <table>
      <thead id="file-headers"><tr>
        <th data-key="name" class="sortable" title="sort by name">Name <span class="arrow"></span></th>
        <th data-key="size" class="sortable" title="sort by size">Size <span class="arrow"></span></th>
        <th data-key="mtime" class="sortable" title="sort by upload date">Uploaded <span class="arrow"></span></th>
        <th class="spacer"></th><!-- absorbs table slack: gap goes here, before Actions -->
        <th>Actions</th>
      </tr></thead>
      <tbody id="file-rows"></tbody>
    </table>
    </div>
    <div class="empty" id="files-empty">No files uploaded yet.</div>
  </div>

  <div class="card">
    <h2>Print jobs <button id="jobs-clear" class="small danger" title="Remove finished jobs from the list (running jobs keep going)">Clear all</button></h2>
    <div id="job-rows"><div class="empty">No jobs yet.</div></div>
  </div>
</div>

<div id="preview" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-head">
      <span class="name" id="preview-name"></span>
      <span class="preview-dims" id="preview-dims"></span>
      <button id="preview-close" class="small">Close</button>
    </div>
    <div id="preview-body"></div>
    <div class="preview-legend" id="preview-legend" hidden></div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";

const state = { files: [], jobs: [], cfg: {}, devicesKey: "", filesKey: "", jobsKey: "", search: "",
                 sort: { key: "mtime", dir: "desc" } };  /* matches the server default (newest first) */
let toastTimer = null;

/* ---------- helpers ---------- */

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  let data = {};
  try { data = await res.json(); } catch {}
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function toast(msg, kind = "") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "show" + (kind ? " " + kind : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = "", 4000);
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

/* Rebuilding the table/job DOM is the one thing that can jolt the viewport
   (the browser's scroll anchoring reacts when the rows are torn down and
   re-laid-out). Save the scroll positions, run the rebuild, restore immediately
   and once more after the new frame has laid out — the page never jumps when
   a poll or an action re-renders while the user is reading lower down. */
function withPreservedScroll(fn) {
  const saved = [document.scrollingElement, ...document.querySelectorAll(".table-wrap")].map(
    el => (el ? [el, el.scrollTop] : null));
  fn();
  const restore = () => { for (const s of saved) if (s) s[0].scrollTop = s[1]; };
  restore();
  requestAnimationFrame(() => requestAnimationFrame(restore));
}

function fmtSize(n) {
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / 1024 / 1024).toFixed(2) + " MB";
}

function fmtTime(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

/* ---------- rendering ---------- */

function sortFiles(files) {
  const { key, dir } = state.sort;
  const m = dir === "asc" ? 1 : -1;
  return [...files].sort((a, b) => key === "name"
    ? m * a.name.localeCompare(b.name, undefined, { sensitivity: "base" })
    : m * (a[key] - b[key]));
}

function renderFiles() {
  const q = state.search.trim().toLowerCase();
  const filtered = q ? state.files.filter(f => f.name.toLowerCase().includes(q)) : state.files;
  const files = sortFiles(filtered);

  /* Skip the rebuild when the rendered state hasn't changed — the 2.5 s poll
     would otherwise tear the whole table down and re-lay it out (flicker + a
     scroll jump) even when the file list is identical. cfg.printer_dev is part
     of the key because each row's Cut tooltip embeds the current device. */
  const key = JSON.stringify([q, state.sort, state.cfg.printer_dev, files]);
  if (key === state.filesKey) return;
  state.filesKey = key;

  document.querySelectorAll("#file-headers th[data-key]").forEach(th => {
    const on = th.dataset.key === state.sort.key;
    th.querySelector(".arrow").textContent = on ? (state.sort.dir === "asc" ? "▲" : "▼") : "";
  });

  const tbody = document.getElementById("file-rows");
  tbody.innerHTML = "";
  document.getElementById("file-count").textContent = q ? `${files.length}/${state.files.length}` : state.files.length;
  const empty = document.getElementById("files-empty");
  empty.style.display = files.length ? "none" : "";
  /* only visible when files.length === 0 (see style above) */
  empty.textContent = q ? `No files match “${state.search.trim()}”.` : "No files uploaded yet.";

  for (const f of files) {
    const tr = document.createElement("tr");
    const actions = document.createElement("div");
    actions.className = "row-actions";

    const printBtn = document.createElement("button");
    printBtn.textContent = "Cut";  /* it's a cutter — the action cuts */
    printBtn.className = "primary";  /* main action → blue highlight, like the upload section */
    printBtn.disabled = !f.printable;
    printBtn.title = f.printable ? `cat ${f.name} > ${state.cfg.printer_dev || "printer"}` : "File type not allowed";
    printBtn.onclick = () => printFiles([f.name]);

    const delBtn = document.createElement("button");
    delBtn.textContent = "Delete";
    delBtn.className = "danger small";
    delBtn.onclick = () => deleteFile(f.name);

    const previewBtn = document.createElement("button");
    previewBtn.textContent = "Preview";
    previewBtn.title = "Open a 2D drawing of the cut";
    previewBtn.onclick = () => previewFile(f.name);

    actions.append(printBtn, previewBtn, delBtn);

    /* actions must live inside a <td> — a bare <div> appended to <tr> gets
       foster-parented out of the table by the browser */
    tr.innerHTML = `<td class="name">${esc(f.name)}</td><td class="num">${fmtSize(f.size)}</td><td class="num">${fmtTime(f.mtime)}</td><td class="spacer"></td><td class="actions"></td>`;  /* spacer (col 4) must stay before actions (col 5) */
    tr.lastElementChild.appendChild(actions);
    tbody.appendChild(tr);
    /* tooltip with the full name only when it is actually clipped (very long names) */
    const nameTd = tr.firstElementChild;
    nameTd.title = nameTd.scrollWidth > nameTd.clientWidth ? f.name : "";
  }
}

function renderJobs() {
  /* skip the rebuild when nothing changed (same reason as in renderFiles) */
  const key = JSON.stringify(state.jobs);
  if (key === state.jobsKey) return;
  state.jobsKey = key;
  const clearBtn = document.getElementById("jobs-clear");
  clearBtn.disabled = !state.jobs.some(j => j.status === "done" || j.status === "error");
  const box = document.getElementById("job-rows");
  const jobs = state.jobs.slice(0, 12);
  box.innerHTML = jobs.length ? "" : '<div class="empty">No jobs yet.</div>';
  for (const j of jobs) {
    const block = document.createElement("div");
    block.className = "job-block";
    const row = document.createElement("div");
    row.className = "job";
    row.innerHTML =
      `<span class="pill ${j.status}">${j.status}</span>` +
      `<span class="file" title="${esc(j.message)}">${esc(j.file)}</span>` +
      `<span class="msg" title="${esc(j.message)}">${esc(j.message)}</span>` +
      `<span class="time">${fmtTime(j.created)}</span>`;
    block.appendChild(row);
    if (j.hint) {
      const hint = document.createElement("div");
      hint.className = "job-hint";
      hint.textContent = j.hint;  /* textContent: never inject server text as HTML */
      block.appendChild(hint);
    }
    box.appendChild(block);
  }
}

async function loadDevices() {
  try {
    const d = await api("/api/devices");
    state.cfg.printer_dev = d.current;
    const sel = document.getElementById("printer-select");
    const key = d.current + "|" + d.devices.map(x => x.path + "|" + (x.label || "")).join(",");
    if (key === state.devicesKey) return;  /* unchanged — don't touch an open dropdown */
    state.devicesKey = key;
    sel.innerHTML = "";
    for (const dev of d.devices) {
      const o = document.createElement("option");
      o.value = dev.path;
      o.textContent = dev.path + (dev.label ? " - " + dev.label : "") + (dev.exists ? "" : " (missing)");
      sel.appendChild(o);
    }
    sel.value = d.current;
    if (sel.value !== d.current) sel.selectedIndex = 0;
  } catch { /* server briefly unreachable */ }
}

document.getElementById("printer-select").addEventListener("change", async (e) => {
  const dev = e.target.value;
  try {
    const d = await api("/api/devices", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ device: dev }),
    });
    state.cfg.printer_dev = d.current;
    toast(`printer → ${d.current}${d.label ? " - " + d.label : ""}`);
  } catch (err) {
    toast(`Could not set printer: ${err.message}`, "error");
    await loadDevices();  /* revert the selection */
  }
});

async function refresh() {
  try {
    const [files, jobs] = await Promise.all([api("/api/files"), api("/api/jobs")]);
    state.files = files.files;
    state.jobs = jobs.jobs;
    withPreservedScroll(() => { renderFiles(); renderJobs(); });
    loadDevices();
  } catch (err) {
    /* server briefly unreachable — keep polling */
  }
}

/* ---------- actions ---------- */

async function uploadFiles(fileList) {
  const files = [...fileList];
  if (!files.length) return;
  const fd = new FormData();
  files.forEach(f => fd.append("files", f));
  try {
    const data = await api("/api/upload", { method: "POST", body: fd });
    toast(`Uploaded ${data.saved.length} file${data.saved.length === 1 ? "" : "s"}`);
    if (data.skipped && data.skipped.length) toast(data.skipped.join("; "), "warn");
    await refresh();
  } catch (err) {
    toast(`Upload failed: ${err.message}`, "error");
  }
}

async function printFiles(names) {
  try {
    await api("/api/print", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ files: names }),
    });
    toast(`Queued ${names.length} file${names.length === 1 ? "" : "s"} for printing`);
    await refresh();
  } catch (err) {
    toast(`Print failed: ${err.message}`, "error");
  }
}

async function deleteFile(name) {
  if (!confirm(`Delete ${name} from the server?`)) return;
  try {
    await api("/api/files?name=" + encodeURIComponent(name), { method: "DELETE" });
    toast(`Deleted ${name}`);
    await refresh();
  } catch (err) {
    toast(`Delete failed: ${err.message}`, "error");
  }
}

/* ---------- upload zone wiring ---------- */

const zone = document.getElementById("dropzone");
const input = document.getElementById("file-input");

zone.addEventListener("click", () => input.click());
input.addEventListener("change", () => { uploadFiles(input.files); input.value = ""; });
["dragenter", "dragover"].forEach(ev =>
  zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add("drag"); }));
["dragleave", "drop"].forEach(ev =>
  zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove("drag"); }));
zone.addEventListener("drop", e => uploadFiles(e.dataTransfer.files));

document.getElementById("file-search").addEventListener("input", e => {
  state.search = e.target.value;
  withPreservedScroll(renderFiles);  /* keep filtering across the 2.5 s refreshes */
});

document.querySelectorAll("#file-headers th[data-key]").forEach(th =>
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    /* new column → ascending; same column → flip direction */
    state.sort = key === state.sort.key
      ? { key, dir: state.sort.dir === "asc" ? "desc" : "asc" }
      : { key, dir: "asc" };
    withPreservedScroll(renderFiles);
  }));

document.getElementById("jobs-clear").addEventListener("click", async () => {
  try {
    const d = await api("/api/jobs", { method: "DELETE" });
    toast(`Cleared ${d.cleared} finished job${d.cleared === 1 ? "" : "s"}`);
    await refresh();
  } catch (err) {
    toast(`Could not clear jobs: ${err.message}`, "error");
  }
});

/* ---------- HPGL preview ----------
   Pen-plotter HPGL (HPGL/1) is a small ASCII command language. The subset a
   cutter file uses: PU/SU/XY = move with pen up, PD/SD/SP = move with pen
   down (the cut itself), X/Y = single-axis moves, SF = scale factor (inches
   per coordinate unit), AM = absolute/relative, AC = cartesian/polar, IN =
   reset. Bare coordinate statements repeat the last motion command, as the
   spec requires. Everything else (colors, fills, arcs, text) is ignored. */

const HPGL_PU = new Set(["PU", "SU", "XY"]);
const HPGL_PD = new Set(["PD", "SD", "SP"]);

function parseHPGL(text) {
  const cuts = [], moves = [];  // segments: [x1, y1, x2, y2]
  let x = 0, y = 0, scale = 1, rel = false, polar = false, motion = "pu";

  const step = (nx, ny) => {
    if (polar) {  /* (angle°, radius) around the current position */
      const a = nx * Math.PI / 180;
      nx = x + ny * Math.cos(a);
      ny = y + ny * Math.sin(a);
    } else if (rel) { nx += x; ny += y; }
    (motion === "pd" ? cuts : moves).push([x, y, nx, ny]);
    x = nx; y = ny;
  };

  for (const stmt of text.split(";")) {
    const s = stmt.replace(/^\s+/, "");
    if (!s) continue;
    const m = s.match(/^([A-Za-z]{1,3})(.*)$/s);  /* no separator required: cutter files write "PU359,1011" */
    if (m && !m[2]) continue;  /* bare command with no args (a query, e.g. "SP;") */
    let cmd = null, args = s;
    if (m) { cmd = m[1].toUpperCase(); args = m[2] || ""; }
    else if (!/^[XYxy]/.test(s)) cmd = motion === "pd" ? "PD" : "PU";  /* bare coordinates repeat the last motion */
    const nums = [...args.matchAll(/-?\d+(?:\.\d+)?/g)].map(t => parseFloat(t[0]));
    if (cmd === "IN") { x = 0; y = 0; scale = 1; rel = false; polar = false; continue; }
    if (cmd === "SF") { if (nums.length && nums[0] > 0) scale = nums[0]; continue; }
    if (cmd === "AM") { if (nums.length) rel = nums[0] !== 0; continue; }
    if (cmd === "AC") { if (nums.length) polar = nums[0] !== 0; continue; }
    if (!HPGL_PU.has(cmd) && !HPGL_PD.has(cmd)) continue;  /* ignored (colors, fills, arcs, text, …) */
    motion = HPGL_PD.has(cmd) ? "pd" : "pu";
    for (let i = 0; i + 1 < nums.length; i += 2) step(nums[i], nums[i + 1]);  /* a trailing unpaired number is dropped (v1) */
  }
  return { cuts, moves, scale };
}

function isBinaryHPGL(bytes) {
  /* HPGL/2 (big plotters) is binary — the first bytes are "1050" + 01 02 03.
     Any byte outside printable ASCII (except tab/newlines) gives it away. */
  for (const b of bytes)
    if (b !== 9 && b !== 10 && b !== 13 && (b < 32 || b > 126)) return true;
  return false;
}

const preview = document.getElementById("preview");
let previewToken = 0;  /* invalidates fetches for a closed/replaced preview */

function previewMsg(body, text, isError = false) {
  body.innerHTML = "";
  const d = document.createElement("div");
  d.className = "preview-msg" + (isError ? " error" : "");
  d.textContent = text;
  body.appendChild(d);
}

function closePreview() { previewToken++; preview.hidden = true; }

document.getElementById("preview-close").addEventListener("click", closePreview);
preview.addEventListener("click", e => { if (e.target === preview) closePreview(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !preview.hidden) closePreview(); });

async function previewFile(name) {
  const token = ++previewToken;
  const body = document.getElementById("preview-body");
  document.getElementById("preview-name").textContent = name;
  document.getElementById("preview-dims").textContent = "";
  document.getElementById("preview-legend").hidden = true;
  previewMsg(body, "loading…");
  preview.hidden = false;
  try {
    const res = await fetch("/api/file?name=" + encodeURIComponent(name));
    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      try { msg = (await res.json()).error || msg; } catch {}
      throw new Error(msg);
    }
    const bytes = new Uint8Array(await res.arrayBuffer());
    if (token !== previewToken) return;  /* closed or superseded — drop the result */
    if (isBinaryHPGL(bytes)) throw new Error("hpgl/2 not supported");
    renderHpglPreview(parseHPGL(new TextDecoder().decode(bytes)), body);
  } catch (err) {
    if (token === previewToken) previewMsg(body, err.message, true);
  }
}

function renderHpglPreview(doc, body) {
  const { cuts, moves, scale } = doc;
  const SVG = "http://www.w3.org/2000/svg";
  const bbox = segs => {
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for (const s of segs) {
      x1 = Math.min(x1, s[0], s[2]); x2 = Math.max(x2, s[0], s[2]);
      y1 = Math.min(y1, s[1], s[3]); y2 = Math.max(y2, s[1], s[3]);
    }
    return { x1, y1, x2, y2, w: x2 - x1, h: y2 - y1 };
  };
  let bb = cuts.length ? bbox(cuts) : (moves.length ? bbox(moves) : null);
  if (!bb || !isFinite(bb.x1)) { previewMsg(body, "no drawing found — the file has no PU/PD coordinates", true); return; }
  /* zero-area guard (a single point): grow the box so it is still visible */
  if (bb.w < 1e-6) { bb.x1 -= 0.5; bb.x2 += 0.5; bb.w = 1; }
  if (bb.h < 1e-6) { bb.y1 -= 0.5; bb.y2 += 0.5; bb.h = 1; }

  const pad = Math.max(bb.w, bb.h) * 0.05;
  const fy = v => bb.y1 + bb.h - v;  /* HPGL y grows upward, SVG y grows down */
  const f = n => (Math.round(n * 1000) / 1000).toString();
  const d = segs => segs.map(s => `M${f(s[0])} ${f(fy(s[1]))}L${f(s[2])} ${f(fy(s[3]))}`).join("");

  body.innerHTML = "";
  const svg = document.createElementNS(SVG, "svg");
  svg.setAttribute("viewBox", `${f(bb.x1 - pad)} ${f(bb.y1 - pad)} ${f(bb.w + 2 * pad)} ${f(bb.h + 2 * pad)}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  if (moves.length) {
    const p = document.createElementNS(SVG, "path");  /* pen-up travel — faint, dashed */
    p.setAttribute("d", d(moves));
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", "var(--dim)");
    p.setAttribute("stroke-width", "1");
    p.setAttribute("stroke-dasharray", "3 3");
    p.setAttribute("vector-effect", "non-scaling-stroke");
    svg.appendChild(p);
  }
  if (cuts.length) {
    const p = document.createElementNS(SVG, "path");  /* the actual cut — accent color */
    p.setAttribute("d", d(cuts));
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", "var(--accent)");
    p.setAttribute("stroke-width", "1.5");
    p.setAttribute("stroke-linecap", "round");
    p.setAttribute("vector-effect", "non-scaling-stroke");
    svg.appendChild(p);
  }
  body.appendChild(svg);

  const len = v => v >= 10 ? v.toFixed(1) : v >= 1 ? v.toFixed(2) : v.toFixed(3);
  document.getElementById("preview-dims").textContent =
    `≈ ${len(bb.w * scale)} × ${len(bb.h * scale)} in`;
  const legend = document.getElementById("preview-legend");
  legend.innerHTML = "";
  if (cuts.length) legend.insertAdjacentHTML("beforeend",
    `<span><span class="sw"></span>cut path</span>`);
  if (moves.length) legend.insertAdjacentHTML("beforeend",
    `<span><span class="sw up"></span>pen travel</span>`);
  legend.hidden = false;
}

/* ---------- init ---------- */

(async () => {
  try {
    state.cfg = await api("/api/config");
    const dirEl = document.getElementById("cfg-dir");
    dirEl.textContent = state.cfg.upload_dir;
    dirEl.title = state.cfg.upload_dir;
    const exts = state.cfg.allowed_exts;
    if (exts && exts.length) {
      const s = exts.map(e => "." + e).join(", ");
      document.getElementById("dz-exts").textContent = s;
      const b = document.getElementById("cfg-exts");
      b.textContent = "files " + s;
      b.hidden = false;
      input.accept = s;
    }
  } catch {}
  await refresh();
  setInterval(refresh, 2500);
})();
</script>
